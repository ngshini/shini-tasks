<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!-- Fontconfig toi gian cho ban Windows dong goi: chi dung font he thong cua
     Windows (Segoe UI co tieng Viet). Kem theo spec vao etc/fonts va rthook
     dat FONTCONFIG_FILE tro vao file nay. -->
<fontconfig>
  <dir>C:\Windows\Fonts</dir>
  <match target="pattern">
    <test qual="any" name="family"><string>sans-serif</string></test>
    <edit name="family" mode="assign" binding="same"><string>Segoe UI</string></edit>
  </match>
</fontconfig>
